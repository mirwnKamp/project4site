<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Project4 · Coming soon</title>
<meta name="description" content="Project4: something new is coming.">
<meta property="og:image" content="https://l2project4.com/main-page/mainlogofinal.png">
<link rel="icon" href="/main-page/4only.png">
<link rel="preload" href="/fonts/cinzel-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: 'Cinzel'; font-weight: 400 900; font-display: swap; src: url('/fonts/cinzel-latin.woff2') format('woff2'); }
@font-face { font-family: 'Inter'; font-weight: 100 900; font-display: swap; src: url('/fonts/inter-latin.woff2') format('woff2'); }
:root {
    --gold: #d4a85a; --gold-2: #a87a35; --gold-light: #f6e2b3; --glow: rgba(226, 183, 102, .35);
    --bg: #07080c; --text: #e9e4d8; --muted: #a39c8c; --line: rgba(212, 168, 90, .28);
    --ease: cubic-bezier(.2, .7, .2, 1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
       overflow: hidden; -webkit-font-smoothing: antialiased; }

.bg, .bg video, .shade, #embers { position: fixed; inset: 0; width: 100%; height: 100%; }
.bg video { object-fit: cover; filter: saturate(.75) brightness(.55); transform: scale(1.06); animation: drift 30s ease-in-out infinite alternate; }
.shade { background:
    radial-gradient(ellipse 70% 60% at 50% 45%, rgba(7,8,12,.15), rgba(7,8,12,.85) 70%, #07080c 100%),
    linear-gradient(180deg, rgba(7,8,12,.6), transparent 30%, transparent 65%, #07080c); }
#embers { pointer-events: none; }

main { position: relative; z-index: 2; min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
       padding: 32px 16px 88px; text-align: center; }

.logo { width: min(440px, 82vw); height: auto; filter: drop-shadow(0 0 28px var(--glow)); animation: breathe 5s ease-in-out infinite, rise 1.4s var(--ease) both; }
.eyebrow { margin-top: 26px; font: 600 12px/1 'Inter', sans-serif; letter-spacing: .42em; text-transform: uppercase; color: var(--gold);
           display: flex; align-items: center; gap: 14px; animation: rise 1.4s .25s var(--ease) both; }
.eyebrow::before, .eyebrow::after { content: ''; width: 48px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold)); }
.eyebrow::after { transform: scaleX(-1); }

h1 { margin-top: 18px; font: 700 clamp(30px, 6.2vw, 66px)/1.08 'Cinzel', Georgia, serif; letter-spacing: .02em;
     background: linear-gradient(100deg, var(--gold-2) 0%, var(--gold-light) 25%, var(--gold) 45%, #fff6dc 50%, var(--gold) 55%, var(--gold-light) 75%, var(--gold-2) 100%);
     background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
     animation: shine 7s linear infinite, rise 1.4s .4s var(--ease) both; }
.lead { margin-top: 18px; max-width: 560px; font-size: clamp(15px, 2vw, 17px); line-height: 1.65; color: var(--muted); animation: rise 1.4s .55s var(--ease) both; }
.lead b { color: var(--text); font-weight: 600; }

.forge { margin-top: 34px; width: min(420px, 100%); animation: rise 1.4s .7s var(--ease) both; }
.forge__bar { position: relative; height: 3px; border-radius: 3px; background: rgba(212,168,90,.14); overflow: hidden; }
.forge__bar::after { content: ''; position: absolute; top: 0; bottom: 0; width: 38%; border-radius: 3px;
    background: linear-gradient(90deg, transparent, var(--gold), var(--gold-light), var(--gold), transparent);
    box-shadow: 0 0 14px var(--glow); animation: sweep 2.6s var(--ease) infinite; }
.forge__label { margin-top: 12px; display: flex; justify-content: space-between; font-size: 11px; letter-spacing: .28em; text-transform: uppercase; color: var(--muted); }
.forge__label span:last-child { color: var(--gold); }
.dot { display: inline-block; animation: blink 1.4s infinite; }
.dot:nth-child(2) { animation-delay: .2s; } .dot:nth-child(3) { animation-delay: .4s; }

.discord { margin-top: 38px; display: inline-flex; align-items: center; gap: 12px; padding: 14px 26px; border-radius: 999px;
    color: #1a1206; font: 700 14px/1 'Inter', sans-serif; letter-spacing: .08em; text-transform: uppercase; text-decoration: none;
    background: linear-gradient(180deg, #f0cf8a, #c9974a); box-shadow: 0 8px 30px rgba(212,168,90,.28), inset 0 1px 0 rgba(255,255,255,.5);
    transition: transform .3s var(--ease), box-shadow .3s var(--ease); animation: rise 1.4s .85s var(--ease) both; }
.discord:hover, .discord:focus-visible { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(212,168,90,.45), inset 0 1px 0 rgba(255,255,255,.5); }
.discord:focus-visible { outline: 2px solid var(--gold-light); outline-offset: 4px; }
.discord svg { width: 20px; height: 20px; }

footer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; padding: 18px 16px; text-align: center; font-size: 12px; letter-spacing: .12em; color: rgba(163,156,140,.7); }
.corner { position: fixed; z-index: 1; width: 64px; height: 64px; border: 1px solid var(--line); pointer-events: none; }
.corner.tl { top: 18px; left: 18px; border-right: 0; border-bottom: 0; }
.corner.tr { top: 18px; right: 18px; border-left: 0; border-bottom: 0; }
.corner.bl { bottom: 18px; left: 18px; border-right: 0; border-top: 0; }
.corner.br { bottom: 18px; right: 18px; border-left: 0; border-top: 0; }

@keyframes rise { from { opacity: 0; transform: translateY(18px); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes breathe { 50% { filter: drop-shadow(0 0 46px rgba(240,207,138,.55)); } }
@keyframes shine { to { background-position: -250% 0; } }
@keyframes sweep { from { left: -40%; } to { left: 102%; } }
@keyframes blink { 50% { opacity: .2; } }
@keyframes drift { to { transform: scale(1.14) translate(-1.5%, -1%); } }
@media (max-width: 600px) { .corner { width: 36px; height: 36px; } .eyebrow { letter-spacing: .3em; font-size: 11px; } .eyebrow::before, .eyebrow::after { width: 24px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><video autoplay muted loop playsinline preload="auto" src="/main-page/darkElf.webm"></video></div>
<div class="shade" aria-hidden="true"></div>
<canvas id="embers" aria-hidden="true"></canvas>
<i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>

<main>
    <img class="logo" src="/main-page/p4.png" alt="Project4" width="560" height="190">
    <h1>Something new<br>is coming</h1>
    <p class="lead">We are forging a <b>brand new Project4</b>. The website is closed while we prepare the new world for you. Stay close: the doors open soon.</p>
    <div class="forge" role="status">
        <div class="forge__bar"></div>
        <div class="forge__label"><span>Under construction</span><span>Forging<i class="dot">.</i><i class="dot">.</i><i class="dot">.</i></span></div>
    </div>
    <a class="discord" href="https://discord.gg/jG8GzyqGMy" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.3 4.4A19.6 19.6 0 0 0 15.4 3l-.6 1.3a18.2 18.2 0 0 0-5.6 0L8.6 3a19.5 19.5 0 0 0-4.9 1.5C.6 9.1-.3 13.6.1 18a19.8 19.8 0 0 0 6 3l1.3-2.1a12.8 12.8 0 0 1-2-1l.5-.4a14 14 0 0 0 12.2 0l.5.4a12.8 12.8 0 0 1-2 1l1.3 2.1a19.7 19.7 0 0 0 6-3c.5-5.1-.8-9.6-3.6-13.6ZM8 15.3c-1.2 0-2.2-1.1-2.2-2.4S6.8 10.5 8 10.5s2.2 1.1 2.2 2.4-1 2.4-2.2 2.4Zm8 0c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4Z"/></svg>
        Follow the news on Discord
    </a>
</main>
<footer>© Project4 · l2project4.com</footer>

<script>
// Gold embers rising from the bottom (stops when the tab is hidden; off for reduced motion).
(function () {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var c = document.getElementById('embers'), x = c.getContext('2d'), w, h, dpr, parts = [];
    function size() { dpr = Math.min(devicePixelRatio || 1, 2); w = innerWidth; h = innerHeight; c.width = w * dpr; c.height = h * dpr; x.setTransform(dpr, 0, 0, dpr, 0, 0); }
    function spawn(p, fresh) {
        p.x = Math.random() * w; p.y = fresh ? Math.random() * h : h + 10;
        p.r = .6 + Math.random() * 1.8; p.vy = .25 + Math.random() * .7; p.sw = Math.random() * 6.28; p.life = 0; p.max = 300 + Math.random() * 500;
        return p;
    }
    size(); addEventListener('resize', size);
    for (var i = 0, n = Math.round(Math.min(90, w / 14)); i < n; i++) parts.push(spawn({}, true));
    function tick() {
        x.clearRect(0, 0, w, h); x.globalCompositeOperation = 'lighter';
        for (var i = 0; i < parts.length; i++) {
            var p = parts[i]; p.life++; p.y -= p.vy; p.sw += .02; p.x += Math.sin(p.sw) * .35;
            var a = Math.sin(Math.PI * Math.min(p.life / p.max, 1));
            if (p.y < -10 || p.life > p.max) spawn(p, false);
            var g = x.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 5);
            g.addColorStop(0, 'rgba(255,226,160,' + (.9 * a) + ')'); g.addColorStop(.4, 'rgba(226,160,70,' + (.35 * a) + ')'); g.addColorStop(1, 'rgba(226,160,70,0)');
            x.fillStyle = g; x.beginPath(); x.arc(p.x, p.y, p.r * 5, 0, 6.28); x.fill();
        }
        requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
})();
</script>
</body>
</html>
